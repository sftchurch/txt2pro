<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>txt2pro</title>
    <script>
      // Set background immediately to prevent white flash in dark mode
      (function(){
        var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var bg = d ? '#0e0f13' : '#f7f7f8';
        var fg = d ? '#e5e7eb' : '#111827';
        document.documentElement.style.background = bg;
        document.body && (document.body.style.background = bg, document.body.style.color = fg);
      })();
    </script>
    <style>body{background:#f7f7f8}@media(prefers-color-scheme:dark){body{background:#0e0f13}}</style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
