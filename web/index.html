<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>txt2pro</title>
    <script>
      // Set background immediately to prevent white flash in dark mode
      (function(){
        var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var bg = d ? '#0e0f13' : '#f7f7f8';
        var fg = d ? '#e5e7eb' : '#111827';
        document.documentElement.style.background = bg;
        document.body && (document.body.style.background = bg, document.body.style.color = fg);
      })();
    </script>
    <style>
      body{background:#f7f7f8}@media(prefers-color-scheme:dark){body{background:#0e0f13}}
      /* Self-hosted so slide previews measure the same font ProPresenter renders,
         regardless of what's installed on the viewer's machine */
      @font-face{
        font-family:'Linux Biolinum';
        src:url('/fonts/LinBiolinum_R.woff2') format('woff2');
        font-weight:400;
        font-style:normal;
        font-display:swap;
      }
      /* PT Serif for the youth template previews (same parity reasoning) */
      @font-face{
        font-family:'PT Serif';
        src:url('/fonts/PTSerif-R-cyrillic-ext.woff2') format('woff2');
        font-weight:400;font-style:normal;font-display:swap;
        unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;
      }
      @font-face{
        font-family:'PT Serif';
        src:url('/fonts/PTSerif-R-cyrillic.woff2') format('woff2');
        font-weight:400;font-style:normal;font-display:swap;
        unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
      }
      @font-face{
        font-family:'PT Serif';
        src:url('/fonts/PTSerif-R-latin-ext.woff2') format('woff2');
        font-weight:400;font-style:normal;font-display:swap;
        unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }
      @font-face{
        font-family:'PT Serif';
        src:url('/fonts/PTSerif-R-latin.woff2') format('woff2');
        font-weight:400;font-style:normal;font-display:swap;
        unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
