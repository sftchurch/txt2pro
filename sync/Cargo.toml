[package]
name = "txt2pro-sync"
version = "0.1.0"
edition = "2024"
description = "Mirrors published txt2pro .proBundle files onto the ProPresenter Mac"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
